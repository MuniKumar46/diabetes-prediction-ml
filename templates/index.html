
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #e8eaf6);
            color: #263238;
            min-height: 100vh;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #00796b;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .header p {
            color: #607d8b;
            font-size: 15px;
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #37474f;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        input:focus {
            border-color: #009688;
            box-shadow: 0 0 0 3px rgba(0, 150, 136, 0.12);
        }

        .submit-btn {
            display: block;
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #008577;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .submit-btn:hover {
            background: #00695c;
            transform: translateY(-2px);
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #e0f2f1;
            border-left: 5px solid #008577;
            border-radius: 8px;
            text-align: center;
            color: #004d40;
            font-size: 18px;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #78909c;
            line-height: 1.6;
        }

        @media (max-width: 600px) {
            .container {
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Diabetes Prediction System</h1>
            <p>
                Enter the required health measurements below
                to obtain a machine-learning prediction.
            </p>
        </div>

        <form action="/predict" method="POST">

            <div class="form-grid">

                <div class="form-group">
                    <label for="num_preg">Number of Pregnancies</label>
                    <input type="text" id="num_preg"
                           name="num_preg" min="0" required>
                </div>

                <div class="form-group">
                    <label for="glucose_conc">Glucose Concentration</label>
                    <input type="text" id="glucose_conc"
                           name="glucose_conc" min="0" required>
                </div>

                <div class="form-group">
                    <label for="diastolic_bp">Diastolic Blood Pressure</label>
                    <input type="text" id="diastolic_bp"
                           name="diastolic_bp" min="0" required>
                </div>

                <div class="form-group">
                    <label for="insulin">Insulin</label>
                    <input type="textr" id="insulin"
                           name="insulin" min="0" required>
                </div>

                <div class="form-group">
                    <label for="bmi">Body Mass Index (BMI)</label>
                    <input type="text" id="bmi"
                           name="bmi" min="0" step="any" required>
                </div>

                <div class="form-group">
                    <label for="diab_pred">Diabetes Pedigree Function</label>
                    <input type="text" id="diab_pred"
                           name="diab_pred" min="0" step="any" required>
                </div>

                <div class="form-group">
                    <label for="age">Age (years)</label>
                    <input type="text" id="age"
                           name="age" min="1" required>
                </div>

                <div class="form-group">
                    <label for="skin">Skin Thickness</label>
                    <input type="text" id="skin"
                           name="skin" min="0" required>
                </div>

            </div>

            <button type="submit" class="submit-btn">
                Predict Diabetes
            </button>

        </form>

        {% if prediction_text %}
            <div class="result">
                {{ prediction_text }}
            </div>
        {% endif %}

        <div class="footer">
            Machine Learning Based Healthcare Project<br>
            This tool is for educational purposes and is not a medical diagnosis.
        </div>

    </div>

</body>
</html>
